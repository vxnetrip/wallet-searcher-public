name: PyInstaller-Windows-Release-x64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Python environment on Windows
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12  # You can adjust the Python version as needed

      # Step 3: Install PyInstaller and dependencies from requirements.txt
      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
        shell: pwsh

      # Step 4: Compile the Python script to a single .exe file with PyInstaller and custom naming
      - name: Compile to binary with PyInstaller
        run: |
          $repoName = (Get-Item "$env:GITHUB_WORKSPACE").Name
          pyinstaller --onefile --name "$repoName-windows-x64" --distpath bin main.py
        shell: pwsh
      # Step 5: Upload the compiled .exe as an artifact
      - name: Upload compiled binary
        uses: actions/upload-artifact@v3
        with:
          name: windows-x64
          path: bin/*.exe
